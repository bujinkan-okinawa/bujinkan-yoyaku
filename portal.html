<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>武仁舘 管理ポータル</title>
<style>
  /* 構成：紺のヘッダー＋タブ／ホーム（4つの入口）／全体管理／会員個人管理／利用者管理。予約画面と同じ配色 */
  :root{
    --navy:#1F3A5F; --navy-soft:#e8eef6; --ink:#1d2330; --sub:#687182;
    --line:#dfe3ea; --bg:#f5f6f8; --card:#ffffff; --head-sub:#c8d4e8;
    --ok:#137a4a; --ok-soft:#e3f3ea; --ng:#b42323; --ng-soft:#fbe9e9;
    --warn:#9a6700; --warn-soft:#fff4d6;
    --muted:#a3aab6; --sun:#c0392b; --sat:#2563a8; --overlay:rgba(15,23,35,.45);
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#8fb2e0; --navy-soft:#1c2a3d; --ink:#e6e9ef; --sub:#9aa3b2;
      --line:#2c3440; --bg:#11151b; --card:#1a1f27; --head-sub:#9fb3cf;
      --ok:#4cc38a; --ok-soft:#16301f; --ng:#f07070; --ng-soft:#3a1d1d;
      --warn:#e0b44c; --warn-soft:#3a2f12;
      --muted:#5d6572; --sun:#f08a7e; --sat:#7fb0ea; --overlay:rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#8fb2e0; --navy-soft:#1c2a3d; --ink:#e6e9ef; --sub:#9aa3b2;
    --line:#2c3440; --bg:#11151b; --card:#1a1f27; --head-sub:#9fb3cf;
    --ok:#4cc38a; --ok-soft:#16301f; --ng:#f07070; --ng-soft:#3a1d1d;
    --warn:#e0b44c; --warn-soft:#3a2f12;
    --muted:#5d6572; --sun:#f08a7e; --sat:#7fb0ea; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
  [hidden]{display:none !important}

  .hdr{position:sticky;top:0;z-index:20;background:#1F3A5F;color:#fff}
  .hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;
           max-width:1100px;margin:0 auto}
  .hdr h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
  .hdr .who{font-size:12px;color:#c8d4e8}
  .hdr .out{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;
            padding:3px 12px;font-size:12px;cursor:pointer}
  .tabs{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1100px;margin:0 auto}
  .tabs button{background:transparent;border:0;color:#c8d4e8;padding:8px 12px;font-size:13px;cursor:pointer;
               border-bottom:3px solid transparent;white-space:nowrap}
  .tabs button[aria-current="page"]{color:#fff;border-bottom-color:#fff;font-weight:700}

  .wrap{padding:16px;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{margin:0 0 10px;font-size:16px}
  .card h3{margin:14px 0 8px;font-size:14px;color:var(--sub)}
  .muted{color:var(--sub);font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:0}

  .entries{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  .entry{display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;background:var(--card);
         border:1px solid var(--line);border-radius:12px;padding:16px}
  .entry:hover{border-color:var(--navy)}
  .entry b{font-size:16px;color:var(--navy)}
  .entry[disabled]{cursor:default;opacity:.55}
  .entry[disabled]:hover{border-color:var(--line)}
  .tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--navy-soft);color:var(--navy)}
  .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.ng{background:var(--ng-soft);color:var(--ng)}
  .tag.warn{background:var(--warn-soft);color:var(--warn)}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:14px}
  .btn.pri{background:var(--navy);border-color:var(--navy);color:var(--card);font-weight:700}
  .btn.sm{padding:4px 10px;font-size:13px}
  .btn[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--navy);color:var(--navy);font-weight:700}
  .btn:disabled{opacity:.5;cursor:default}
  input[type=text],input[type=search],input[type=email],input[type=date],select,textarea{
    border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
  textarea{min-height:70px;resize:vertical}
  input[readonly],textarea[readonly]{background:var(--bg);color:var(--sub)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat small{display:block;color:var(--sub);font-size:12px}
  .stat b{font-size:22px;font-variant-numeric:tabular-nums}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:var(--bg);font-size:12px;color:var(--sub);font-weight:700;position:sticky;top:0}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.click{cursor:pointer} tr.click:hover td{background:var(--navy-soft)}
  tbody tr:last-child td{border-bottom:0}

  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 14px}
  .form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--sub)}
  .form label.wide{grid-column:1/-1}

  .subtabs{display:flex;gap:6px;flex-wrap:wrap}

  /* カレンダー（範囲指定つき） */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .cal-head b{font-size:16px;font-variant-numeric:tabular-nums}
  .nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
  .cal{border:1px solid var(--line);border-radius:10px;overflow:hidden;max-width:460px}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .dow div{font-size:11px;text-align:center;padding:4px 0;color:var(--sub);border-bottom:1px solid var(--line)}
  .dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
  .cell{height:48px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
        background:transparent;padding:3px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:0}
  .grid .cell:nth-child(7n){border-right:0}
  .cell .d{font-size:12px;font-variant-numeric:tabular-nums}
  .cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
  .cell.blank{cursor:default}
  .cell.sess .d{font-weight:700}
  .cell.inr{background:var(--navy-soft)}
  .cell.edge{background:var(--navy)} .cell.edge .d{color:var(--card) !important}
  .dot{font-size:10px;line-height:1;border-radius:4px;padding:2px 4px}
  .dot.a{background:var(--ok-soft);color:var(--ok)} .dot.l{background:var(--warn-soft);color:var(--warn)}
  .dot.v{background:var(--navy-soft);color:var(--navy)} .dot.x{background:var(--ng-soft);color:var(--ng)}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-top:6px}
  .split{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}

  /* 徴収管理：会員×月の表のマス */
  .fc{width:34px;height:28px;border-radius:6px;border:1px solid transparent;background:transparent;font-size:12px;
      cursor:pointer;font-weight:700;padding:0}
  .fc.paid{background:var(--ok-soft);color:var(--ok)}
  .fc.exempt{background:var(--navy-soft);color:var(--navy)}
  .fc.unpaid{background:var(--ng-soft);color:var(--ng);border-color:var(--ng)}
  .fc.rest,.fc.free{color:var(--muted);cursor:default}
  .fc.none{cursor:default}
  .fc.future{color:var(--muted);border:1px dashed var(--line)}
  td.fcell{padding:3px 4px;text-align:center}
  tr.total td{background:var(--bg);font-size:12px;color:var(--sub)}
  .modal{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:45;padding:16px}
  .modal .card{width:100%;max-width:520px;max-height:90vh;overflow:auto}
  details summary{cursor:pointer;font-weight:700}

  .gate{max-width:460px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:0 16px}
  .gate b{font-size:17px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
  .toast.ng{background:var(--ng);color:#fff}
  .busy{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:40;color:#fff}
</style>
</head>
<body>

<div id="gate" class="gate">
  <b>武仁舘 管理ポータル</b>
  <div id="gateMsg" class="muted">読み込み中…</div>
  <div id="gbtn"></div>
</div>

<div id="app" hidden>
  <header class="hdr">
    <div class="hdr-top">
      <div>
        <h1>武仁舘 管理ポータル</h1>
        <div class="who" id="who"></div>
      </div>
      <button class="out" id="logout" type="button">ログアウト</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="画面"></nav>
  </header>
  <main class="wrap" id="view"></main>
</div>

<div id="modal" class="modal" hidden></div>
<div id="busy" class="busy" hidden>処理中…</div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function () {
  'use strict';

  // Apps Script の本番デプロイ（予約画面と同じURL）
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbza_1ROShhfxcEoDEoqIKYxcNBIFTsSvIeJhAZ57XaZF13R5By0ogD_t6dtzMutRHzm9g/exec';
  var WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  var TOKEN_KEY = 'bujinkan.portal.token';

  var st = {
    token: '', boot: null, view: 'home',
    members: null,
    // 全体管理
    range: null, pick: null, calYm: '', summary: null, activeOnly: true, sortBy: 'kana',
    // 会員個人管理
    q: '', stateFilter: '在籍', member: null, memberTab: 'info', exams: [], editExam: null,
    att: null, attFrom: '', attTo: '', mRange: null, mPick: null, mCalYm: '',
    users: null,
  };

  // ------------------------------------------------------------
  // ログイン
  // ------------------------------------------------------------
  function start() {
    fetch(GAS_URL + '?api=portalConfig').then(function (r) { return r.json(); }).then(function (cfg) {
      if (!cfg.clientId) return gate('設定が未完了です', 'Apps Script の PORTAL_CLIENT_ID を設定してください。');
      waitGsi(function () {
        google.accounts.id.initialize({ client_id: cfg.clientId, callback: onCredential, auto_select: true });
        var saved = '';
        try { saved = sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
        if (saved && tokenLeft(saved) > 60) { st.token = saved; bootstrap(); }
        else showSignIn('');
      });
    }).catch(function () { gate('接続できませんでした', '通信状態を確認して、開き直してください。'); });
  }

  function waitGsi(fn) {
    if (window.google && google.accounts && google.accounts.id) return fn();
    setTimeout(function () { waitGsi(fn); }, 100);
  }

  function showSignIn(msg) {
    st.token = '';
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
    el('app').hidden = true;
    el('gate').hidden = false;
    el('gateMsg').textContent = msg || '道場から登録されたGoogleアカウントでログインしてください。';
    el('gbtn').innerHTML = '';
    google.accounts.id.renderButton(el('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja' });
    google.accounts.id.prompt();
  }

  function onCredential(res) {
    st.token = res.credential;
    try { sessionStorage.setItem(TOKEN_KEY, st.token); } catch (e) {}
    bootstrap();
  }

  /** IDトークンの残り秒数（中身を読むだけ。検証はサーバーで行います）。 */
  function tokenLeft(token) {
    try {
      var p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
      return p.exp - Date.now() / 1000;
    } catch (e) { return 0; }
  }

  function bootstrap() {
    el('gateMsg').textContent = '確認中…';
    api('apiPortalBootstrap', [], function (res) {
      st.boot = res;
      el('gate').hidden = true;
      el('app').hidden = false;
      el('who').textContent = (res.user.name || res.user.email) + '（' + res.user.role + '）';
      go('home');
    });
  }

  el('logout').addEventListener('click', function () {
    google.accounts.id.disableAutoSelect();
    showSignIn('ログアウトしました。');
  });

  // ------------------------------------------------------------
  // 画面の切り替え
  // ------------------------------------------------------------
  var VIEWS = [
    { id: 'home',    label: 'ホーム' },
    { id: 'overall', label: '全体管理',     need: 'attendance' },
    { id: 'members', label: '会員個人管理', need: 'member' },
    { id: 'changes', label: '変更申請',     need: 'memberEdit' },
    { id: 'fee',     label: '徴収管理',     need: 'fee' },
    { id: 'sales',   label: '物販管理',     need: 'sales', soon: true },
    { id: 'users',   label: '利用者管理',   need: 'users' },
  ];

  function can(p) { return st.boot.user.can.indexOf(p) !== -1; }
  function allowed(v) { return !v.need || can(v.need); }

  function go(view) {
    st.view = view;
    el('tabs').innerHTML = VIEWS.filter(function (v) { return allowed(v) && !v.soon; }).map(function (v) {
      return '<button type="button" data-go="' + v.id + '"' +
        (v.id === view || (view === 'member' && v.id === 'members') ? ' aria-current="page"' : '') + '>' + v.label + '</button>';
    }).join('');
    ({ home: renderHome, overall: renderOverall, members: renderMembers, member: renderMember,
       changes: renderChanges, fee: renderFee, users: renderUsers }[view])();
    window.scrollTo(0, 0);
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-go]');
    if (t) go(t.getAttribute('data-go'));
  });

  // ------------------------------------------------------------
  // ホーム
  // ------------------------------------------------------------
  var ENTRY_NOTE = {
    overall: '在籍数・期間ごとの出席日数',
    members: '会員の登録・編集、進級、出欠カレンダー',
    changes: '会員がフォームで送った登録内容の変更を確認して反映',
    fee:     '月会費の入金登録と未納の確認（年間一覧・月別）',
    sales:   '物販の申込・受け渡し（準備中）',
    users:   'ポータルを使う人と役割の登録',
  };

  function renderHome() {
    el('view').innerHTML =
      '<div class="entries">' + VIEWS.filter(function (v) { return v.id !== 'home' && allowed(v); }).map(function (v) {
        return '<button type="button" class="entry"' + (v.soon ? ' disabled' : ' data-go="' + v.id + '"') + '>' +
          '<b>' + v.label + '</b><span class="muted">' + ENTRY_NOTE[v.id] + '</span>' +
          (v.soon ? '<span><span class="tag warn">準備中</span></span>' : '') + '</button>';
      }).join('') + '</div>';
  }

  // ------------------------------------------------------------
  // 全体管理：在籍数＋期間を指定した出席日数
  // ------------------------------------------------------------
  function renderOverall() {
    if (!st.range) {
      var t = st.boot.today;
      st.range = { from: t.slice(0, 8) + '01', to: t };
      st.calYm = t.slice(0, 7);
    }
    var head = '<div class="card"><h2>在籍状況</h2><div id="ovStats" class="stats"><span class="muted">読み込み中…</span></div></div>';
    el('view').innerHTML = head +
      '<div class="card"><h2>出席日数（期間指定）</h2>' +
      '<div class="split"><div>' + presetButtons('ov') +
      '<div class="row" style="margin:8px 0"><input type="date" id="ovFrom" value="' + st.range.from + '" style="width:auto">' +
      '<span>〜</span><input type="date" id="ovTo" value="' + st.range.to + '" style="width:auto"></div>' +
      '<div id="ovCal"></div><div class="legend">カレンダーで開始日と終了日を順に押すと期間を選べます。太字は稽古日。</div></div>' +
      '<div><div class="row" style="margin-bottom:8px">' +
      '<label class="row muted"><input type="checkbox" id="ovActive"' + (st.activeOnly ? ' checked' : '') + '> 在籍者のみ</label>' +
      '<span class="grow"></span><select id="ovSort" style="width:auto">' +
      opt('kana', 'カナ順', st.sortBy) + opt('total', '出席日数の多い順', st.sortBy) + opt('rank', '段級順', st.sortBy) +
      '</select></div><div id="ovTable" class="muted">集計中…</div></div></div></div>';

    loadMembers(function () {
      if (!el('ovStats')) return;   // 読み込み中に別の画面へ移った
      var m = st.members;
      var n = function (s) { return m.filter(function (x) { return x.state === s; }).length; };
      el('ovStats').innerHTML = stat('在籍', n('在籍')) + stat('休会', n('休会')) + stat('退会', n('退会')) +
        stat('LINE連携（在籍）', m.filter(function (x) { return x.state === '在籍' && x.line; }).length);
    });

    bindPresets('ov', function (r) { st.range = r; st.calYm = r.to.slice(0, 7); loadSummary(); });
    el('ovFrom').onchange = el('ovTo').onchange = function () {
      st.range = { from: el('ovFrom').value, to: el('ovTo').value };
      loadSummary();
    };
    el('ovActive').onchange = function () { st.activeOnly = this.checked; drawSummary(); };
    el('ovSort').onchange = function () { st.sortBy = this.value; drawSummary(); };
    loadSummary();
  }

  function loadSummary() {
    if (!st.range.from || !st.range.to || st.range.from > st.range.to) return toast('期間を確認してください', true);
    el('ovFrom').value = st.range.from; el('ovTo').value = st.range.to;
    drawOvCal();
    el('ovTable').innerHTML = '<span class="muted">集計中…</span>';
    api('apiAttendance', [st.range.from, st.range.to, ''], function (res) {
      st.summary = res;
      if (st.view !== 'overall') return;
      drawOvCal();
      drawSummary();
    }, true);
  }

  function drawOvCal() {
    var sess = {};
    (st.summary && st.summary.sessionDays || []).forEach(function (d) { sess[d] = 1; });
    calendar(el('ovCal'), st.calYm, {
      range: st.range, pick: st.pick, sess: sess,
      onNav: function (ym) { st.calYm = ym; drawOvCal(); },
      onPick: function (d) {
        if (!st.pick) { st.pick = d; drawOvCal(); return; }
        st.range = st.pick <= d ? { from: st.pick, to: d } : { from: d, to: st.pick };
        st.pick = null;
        loadSummary();
      },
    });
  }

  function drawSummary() {
    var s = st.summary;
    if (!s) return;
    var list = s.summary.filter(function (x) { return !st.activeOnly || x.state === '在籍'; });
    var ranks = st.boot.ranks;
    list.sort(function (a, b) {
      if (st.sortBy === 'total') return b.total - a.total || cmpKana(a, b);
      if (st.sortBy === 'rank') return ranks.indexOf(b.rank) - ranks.indexOf(a.rank) || cmpKana(a, b);
      return cmpKana(a, b);
    });
    var multi = s.months.length > 1;
    el('ovTable').innerHTML =
      '<div class="muted" style="margin-bottom:6px">' + esc(dateLabel(s.from)) + ' 〜 ' + esc(dateLabel(s.to)) +
      '　稽古日 ' + s.sessionDays.length + ' 日　対象 ' + list.length + ' 人</div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>氏名</th><th>段級</th><th class="num">出席日数</th><th class="num">出席率</th><th class="num">見学</th>' +
      (multi ? s.months.map(function (ym) { return '<th class="num">' + Number(ym.slice(5)) + '月</th>'; }).join('') : '') +
      '</tr></thead><tbody>' + list.map(function (x) {
        var rate = s.sessionDays.length ? Math.round(x.total / s.sessionDays.length * 100) + '%' : '－';
        return '<tr class="click" data-member="' + esc(x.id) + '"><td>' + esc(x.name) +

    var editable = can('memberEdit');
    el('mbody').innerHTML = '<div class="card"><form id="mform" class="form">' + st.member.fields.map(function (f) {

      } else if (f.type === 'textarea') {
        input = '<textarea name="' + esc(f.name) + '"' + (ro ? ' readonly' : '') + '>' + esc(f.value) + '</textarea>';
      } else {

  /** 出欠：月カレンダーと、カレンダーで選んだ期間の出席日数。 */
  function drawAttendance() {
    el('mbody').innerHTML = '<div class="card"><div class="split"><div><div id="mCal"></div>' +
      '<div class="legend"><span class="dot a">出</span>出席 <span class="dot l">遅</span>遅刻 <span class="dot v">見</span>見学 <span class="dot x">欠</span>欠席</div>' +
      '<div class="legend">開始日と終了日を順に押すと、その期間の出席日数を数えます。</div></div>' +
      '<div>' + presetButtons('m') + '<div id="mStats" class="stats" style="margin-top:10px"></div><div id="mMonths" style="margin-top:10px"></div></div></div></div>';
    bindPresets('m', function (r) { st.mRange = r; st.mCalYm = r.to.slice(0, 7); ensureAtt(); });
    if (!st.mRange) {
      var t = st.boot.today;
      st.mRange = { from: t.slice(0, 8) + '01', to: monthEnd(t.slice(0, 7)) };
    }
    ensureAtt();
  }

  /** 表示中の月と選択中の期間を含むように、出欠を読み込みます（読み込み済みならそのまま）。 */
  function ensureAtt() {
    var from = minStr(st.mRange.from, st.mCalYm + '-01');
    var to = maxStr(st.mRange.to, monthEnd(st.mCalYm));
    if (st.att && st.attFrom <= from && st.attTo >= to) return drawAtt();
    // 前後に余裕を持って読みます（月を送るたびに読み直さないため）
    from = minStr(from, shiftYm(st.mCalYm, -6) + '-01');
    to = maxStr(to, monthEnd(shiftYm(st.mCalYm, 1)));
    api('apiAttendance', [from, to, st.member.id], function (res) {
      st.att = res; st.attFrom = from; st.attTo = to;
      if (st.view === 'member' && st.memberTab === 'att') drawAtt();
    }, true);
  }

  function drawAtt() {
    var c = st.att.calendar;
    var sess = {};
    st.att.sessionDays.forEach(function (d) { sess[d] = 1; });
    calendar(el('mCal'), st.mCalYm, {
      range: st.mRange, pick: st.mPick, sess: sess,
      mark: function (d) {
        if (c.attend[d] === '遅刻') return '<span class="dot l">遅</span>';
        if (c.attend[d]) return '<span class="dot a">出</span>';
        if (c.visit[d]) return '<span class="dot v">見</span>';
        if (c.absent[d]) return '<span class="dot x">欠</span>';
        return '';
      },
      onNav: function (ym) { st.mCalYm = ym; ensureAtt(); },
      onPick: function (d) {
        if (!st.mPick) { st.mPick = d; drawAtt(); return; }
        st.mRange = st.mPick <= d ? { from: st.mPick, to: d } : { from: d, to: st.mPick };
        st.mPick = null;
        ensureAtt();
      },
    });

    var r = st.mRange;
    var inR = function (d) { return d >= r.from && d <= r.to; };
    var days = Object.keys(c.attend).filter(inR);
    var sessN = st.att.sessionDays.filter(inR).length;
    el('mStats').innerHTML = '<div class="muted" style="grid-column:1/-1">' + esc(dateLabel(r.from)) + ' 〜 ' + esc(dateLabel(r.to)) + '</div>' +
      stat('出席日数', days.length) + stat('稽古日数', sessN) +
      stat('出席率', sessN ? Math.round(days.length / sessN * 100) + '%' : '－') +
      stat('見学', Object.keys(c.visit).filter(inR).length);

    var months = [];
    for (var ym = r.from.slice(0, 7); ym <= r.to.slice(0, 7); ym = shiftYm(ym, 1)) months.push(ym);
    el('mMonths').innerHTML = months.length > 1 ? '<div class="tbl-wrap"><table><thead><tr><th>月</th><th class="num">出席日数</th><th class="num">稽古日数</th></tr></thead><tbody>' +
      months.map(function (ym) {
        var inM = function (d) { return d.indexOf(ym) === 0 && inR(d); };
        return '<tr><td>' + ym.slice(0, 4) + '年' + Number(ym.slice(5)) + '月</td><td class="num">' + days.filter(inM).length +
          '</td><td class="num">' + st.att.sessionDays.filter(inM).length + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '';
  }

  // ------------------------------------------------------------
  // 変更申請：今の台帳と申請の内容を並べ、選んだ項目を書き換える

  function renderChanges() {
    el('view').innerHTML = '<div class="card"><h2>変更申請</h2>' +
      '<div class="muted">会員が LINE から登録フォームを送り直すと、ここに並びます。' +

    api('apiChangeRequests', [], function (res) { if (st.view === 'changes') drawChanges(res.requests); }, true);
  }

  function drawChanges(list) {
    if (!list.length) {
      el('clist').innerHTML = '<div class="card muted">未処理の変更申請はありません。</div>';
      return;
    }
    el('clist').className = '';
    el('clist').innerHTML = list.map(function (r) {
      return '<div class="card" data-creq="' + r.row + '"><div class="row" style="margin-bottom:8px">' +
        '<b class="grow">' + esc(r.name) + ' <span class="muted">' + esc(r.memberId) + '</span></b>' +
        '<span class="muted">送信 ' + esc(r.at) + '</span></div>' +
        (r.changes.length ? '<div class="tbl-wrap"><table><thead><tr><th>反映</th><th>項目</th><th>今の内容</th><th>申請の内容</th></tr></thead><tbody>' +
          r.changes.map(function (c) {
            return '<tr><td><input type="checkbox" checked value="' + esc(c.field) + '" aria-label="' + esc(c.field) + 'を反映"></td>' +
              '<td>' + esc(c.field) + '</td><td style="white-space:normal;color:var(--sub)">' + (esc(c.before) || '（空欄）') +
              '</td><td style="white-space:normal"><b>' + esc(c.after) + '</b></td></tr>';
          }).join('') + '</tbody></table></div>'
          : '<div class="muted">今の登録内容と違う項目はありません。</div>') +
        '<div class="row" style="margin-top:10px">' +
        (r.changes.length ? '<button type="button" class="btn pri" data-capply="' + r.row + '">反映する</button>' : '') +
        '<button type="button" class="btn" data-creject="' + r.row + '">' + (r.changes.length ? '反映しない' : '処理済みにする') + '</button>' +
        '</div></div>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('[data-capply]'), function (b) {
      b.onclick = function () {
        var row = b.getAttribute('data-capply');
        var box = document.querySelector('[data-creq="' + row + '"]');
        var fields = Array.prototype.map.call(box.querySelectorAll('input[type=checkbox]:checked'), function (c) { return c.value; });
        if (!fields.length) return toast('反映する項目にチェックを付けてください', true);
        api('apiChangeApply', [Number(row), fields], function (res) {
          st.members = null;
          toast('台帳に反映しました');
          drawChanges(res.requests);
        });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-creject]'), function (b) {
      b.onclick = function () {
        if (!confirm('この申請は台帳に反映せずに、処理済みにします。よろしいですか？')) return;
        api('apiChangeApply', [Number(b.getAttribute('data-creject')), []], function (res) {
          toast('処理済みにしました');
          drawChanges(res.requests);
        });
      };
    });
  }

          var stTag = e.open ? '<span class="tag ok">受付中</span>' : '<span class="tag">' + esc(e.state === '受付中' ? '締切' : e.state) + '</span>';
          return '<tr class="click" data-ev="' + esc(e.id) + '"><td>' + esc(e.date) + '</td><td>' + esc(e.name) + '</td><td>' + stTag + '</td>' +
            '<td class="num">' + (e.fee == null ? '<span class="muted">未設定</span>' : yen(e.fee)) + '</td><td class="num">' + e.n + '人</td>' +
            '<td class="num">' + e.paid + '人 ' + yen(e.paidSum) + '</td>' +
            '<td class="num">' + (e.unpaid ? '<b style="color:var(--ng)">' + e.unpaid + '人 ' + yen(e.unpaidSum) + '</b>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="muted">まだイベントがありません。「＋イベントを登録」から登録してください。</div>') + '</div>';

    el('evNew').onclick = function () { eventDialog(null); };
    if (el('evCopy')) el('evCopy').onclick = function () {
      navigator.clipboard.writeText(r.formUrl).then(function () { toast('URLをコピーしました'); });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-ev]'), function (tr) {
      tr.onclick = function () { openEvent(tr.getAttribute('data-ev')); };
    });
  }

  /** イベントの登録・編集。ev が null なら新規。 */
  function eventDialog(ev) {
    var e = ev || { name: '', date: '', fee: '', feeOther: '', deadline: '', state: '受付中', note: '' };
    var states = (st.ev && st.ev.states) || ['受付中', '締切', '終了', '中止'];
    showModal('<h2>' + (ev ? 'イベントを直す' : 'イベントを登録') + '</h2><form id="evform" class="form">' +
      '<label class="wide">イベント名<input type="text" name="name" value="' + esc(e.name) + '" placeholder="例：夏季合宿2026"></label>' +
      '<label>開催日<input type="date" name="date" value="' + esc(e.date) + '"></label>' +
      '<label>申込締切（空欄なら締切なし）<input type="date" name="deadline" value="' + esc(e.deadline) + '"></label>' +
      '<label>参加費（会員）<input type="text" inputmode="numeric" name="fee" value="' + (e.fee == null ? '' : e.fee) + '" placeholder="円"></label>' +
      '<label>参加費（会員以外）<input type="text" inputmode="numeric" name="feeOther" value="' + (e.feeOther == null ? '' : e.feeOther) + '" placeholder="空欄なら会員と同じ"></label>' +
      '<label>状態<select name="state">' + states.map(function (s) { return opt(s, s, e.state); }).join('') + '</select></label>' +
      '<label class="wide">備考<textarea name="note">' + esc(e.note) + '</textarea></label></form>' +
      '<div class="legend">状態が「受付中」で締切前のイベントだけが、申込フォームの選択肢に出ます。</div>' +
      '<div class="row" style="margin-top:14px"><button type="button" class="btn pri" id="evSave">保存する</button><span class="grow"></span>' +
      '<button type="button" class="btn" data-close>閉じる</button></div>');
    el('evSave').onclick = function () {
      var f = el('evform').elements;
      var data = { id: ev ? ev.id : '', name: f.name.value, date: f.date.value, deadline: f.deadline.value,
        fee: f.fee.value, feeOther: f.feeOther.value, state: f.state.value, note: f.note.value };
      api('apiEventSave', [data], function (res) {
        hideModal();
        toast('保存しました');
        if (ev) openEvent(res.id); else loadEvents();
      });
    };
  }

  function openEvent(id) {
    st.evId = id;
    api('apiEventDetail', [id], function (res) {
      st.evDetail = res;
      if (st.view === 'fee' && st.feeMode === 'event' && st.evId === id) drawEventDetail();
    });
  }

  function drawEventDetail() {
    var d = st.evDetail, e = d.event;
    var live = d.entries.filter(function (x) { return x.state !== '取消'; });
    var unpaidOf = function (x) { return !x.pay && x.fee !== 0 && x.payState !== '不要'; };
    var paid = live.filter(function (x) { return x.pay && x.pay.state === '入金済'; });
    var unpaid = live.filter(unpaidOf);
    var sum = function (list, f) { return list.reduce(function (a, x) { return a + (Number(f(x)) || 0); }, 0); };
    var rows = d.entries.filter(function (x) { return !st.feeUnpaidOnly || (x.state !== '取消' && unpaidOf(x)); })
      .sort(function (a, b) { return (a.state === '取消') - (b.state === '取消') || a.date.localeCompare(b.date); });

    el('fbody').className = '';
    el('fbody').innerHTML = '<div class="card"><div class="row" style="margin-bottom:8px">' +
      '<button type="button" class="btn sm" id="evBack">← イベント一覧</button><b class="grow" style="font-size:18px">' + esc(e.name) + '</b>' +
      '<button type="button" class="btn sm" id="evEdit">直す</button></div>' +
      '<div class="muted">開催日 ' + esc(e.date) + (e.deadline ? '　締切 ' + esc(e.deadline) : '') + '　状態 ' + esc(e.state) +
      '　参加費 ' + (e.fee == null ? '未設定' : yen(e.fee)) + (e.feeOther != null && e.feeOther !== e.fee ? '（会員以外 ' + yen(e.feeOther) + '）' : '') + '</div>' +
      '<div class="stats" style="margin:12px 0">' + stat('申込', live.length + '人') + stat('入金', paid.length + '人') +
      stat('入金額', yen(sum(paid, function (x) { return x.pay.amount; }))) + stat('未納', unpaid.length + '人') +
      stat('未納額', yen(sum(unpaid, function (x) { return x.fee; }))) + '</div>' +
      '<div class="row" style="margin-bottom:8px"><button type="button" class="btn sm" id="evAdd">＋申込を追加（窓口・電話）</button>' +
      '<button type="button" class="btn sm" id="evBulk">チェックした人をまとめて入金OK</button></div>' +
      (rows.length ? '<div class="tbl-wrap"><table><thead><tr><th></th><th>氏名</th><th>区分</th><th>所属・連絡先</th><th>申込日</th><th class="num">参加費</th><th>状態</th><th></th></tr></thead><tbody>' +
        rows.map(function (x) {
          var k = d.entries.indexOf(x);
          var canceled = x.state === '取消';
          var state = canceled ? '<span class="tag">申込取消</span>'
            : x.pay && x.pay.state === '入金済' ? '<span class="tag ok">✓ ' + esc(x.pay.date.slice(5).replace('-', '/')) + ' ' + esc(x.pay.method) + '</span>'
            : x.pay ? '<span class="tag">' + esc(x.pay.state) + '</span>'
            : unpaidOf(x) ? '<span class="tag ng">未納</span>' : '<span class="muted">不要</span>';
          var action = canceled ? ''
            : x.pay ? '<button type="button" class="btn sm" data-evpay="' + k + '">詳細</button>'
            : unpaidOf(x) ? '<button type="button" class="btn sm pri" data-evpay="' + k + '">入金OK</button> <button type="button" class="btn sm" data-evdrop="' + k + '">申込取消</button>'
            : '<button type="button" class="btn sm" data-evdrop="' + k + '">申込取消</button>';
          var who = x.memberId ? '<a href="#" data-member="' + esc(x.memberId) + '">' + esc(x.name) + '</a>' : esc(x.name);
          return '<tr' + (canceled ? ' style="opacity:.5"' : '') + '><td>' + (!canceled && unpaidOf(x) ? '<input type="checkbox" data-evpick="' + k + '">' : '') +
            '</td><td>' + who + '</td><td>' + esc(x.kind) + '</td><td style="white-space:normal">' + esc([x.org, x.tel].filter(Boolean).join(' ')) +
            (x.note ? '<div class="muted" style="font-size:12px">' + esc(x.note) + '</div>' : '') + '</td><td>' + esc(x.date) + '</td>' +
            '<td class="num">' + (x.fee == null ? '<span class="muted">未設定</span>' : yen(x.fee)) + '</td><td>' + state + '</td><td>' + action + '</td></tr>';
        }).join('') + '</tbody></table></div>'
        : '<div class="muted">' + (st.feeUnpaidOnly ? '未納の人はいません。' : 'まだ申込がありません。') + '</div>') + '</div>';

    el('evBack').onclick = function () { st.evId = null; st.evDetail = null; loadEvents(); };
    el('evEdit').onclick = function () { eventDialog(e); };
    el('evAdd').onclick = addEntryDialog;
    var pay = function (list) {
      payDialog(list.map(function (x) {
        return { entryId: x.id, name: x.name, label: e.name, amount: x.fee, checked: true };
      }), function (res) { st.evDetail = res; drawEventDetail(); }, function (entries, date, method, note, exempt) {
        return ['apiEventPay', [e.id, entries, date, method, note, exempt]];
      });
    };
    el('evBulk').onclick = function () {
      var list = Array.prototype.map.call(document.querySelectorAll('[data-evpick]:checked'), function (cb) {
        return d.entries[Number(cb.getAttribute('data-evpick'))];
      });
      if (!list.length) return toast('入金OKにする人にチェックを付けてください', true);
      pay(list);
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-evpay]'), function (b) {
      b.onclick = function () {
        var x = d.entries[Number(b.getAttribute('data-evpay'))];
        if (!x.pay) return pay([x]);
        showModal('<h2>' + esc(x.name) + '　' + esc(e.name) + '</h2><div class="tbl-wrap"><table><tbody>' +
          [['状態', x.pay.state], ['金額', yen(x.pay.amount)], ['入金日', x.pay.date], ['支払方法', x.pay.method],
           ['受領者', x.pay.receiver], ['備考', x.pay.note]].map(function (r) {
            return '<tr><th style="position:static">' + r[0] + '</th><td style="white-space:normal">' + esc(r[1] || '') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          '<div class="row" style="margin-top:14px"><button type="button" class="btn" id="evPayCancel" style="color:var(--ng)">この入金を取り消す</button>' +
          '<span class="grow"></span><button type="button" class="btn" data-close>閉じる</button></div>' +
          '<div class="legend">記録は消えずに「取消」として残り、未納に戻ります。</div>');
        el('evPayCancel').onclick = function () {
          if (!confirm('この入金を取り消して、未納に戻します。よろしいですか？')) return;
          api('apiEventPayCancel', [e.id, x.id], function (res) { hideModal(); toast('取り消しました'); st.evDetail = res; drawEventDetail(); });
        };
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-evdrop]'), function (b) {
      b.onclick = function () {
        var x = d.entries[Number(b.getAttribute('data-evdrop'))];
        if (!confirm(x.name + ' さんの申込を取り消します。よろしいですか？')) return;
        api('apiEventEntryCancel', [e.id, x.id], function (res) { toast('申込を取り消しました'); st.evDetail = res; drawEventDetail(); });
      };
    });
  }

  /** 窓口や電話で受けた申込の追加。会員は一覧から選び、会員以外は氏名などを入力します。 */
  function addEntryDialog() {
    loadMembers(function () {
      var kinds = (st.ev && st.ev.kinds) || ['会員', '会員の家族', '他道場', '一般'];
      var members = st.members.filter(function (m) { return m.state !== '退会'; }).sort(cmpKana);
      showModal('<h2>申込を追加</h2><form id="eaform" class="form">' +
        '<label class="wide">会員の場合は選択<select name="memberId"><option value="">（会員以外）</option>' +
        members.map(function (m) { return '<option value="' + esc(m.id) + '">' + esc(m.name) + '（' + esc(m.id) + '）</option>'; }).join('') + '</select></label>' +
        '<label>氏名（会員以外）<input type="text" name="name"></label>' +
        '<label>区分（会員以外）<select name="kind">' + kinds.filter(function (k) { return k !== '会員'; }).map(function (k) { return opt(k, k, '一般'); }).join('') + '</select></label>' +
        '<label>所属<input type="text" name="org"></label><label>電話番号<input type="text" name="tel"></label>' +
        '<label class="wide">備考<input type="text" name="note"></label></form>' +
        '<div class="row" style="margin-top:14px"><button type="button" class="btn pri" id="eaSave">追加する</button><span class="grow"></span>' +
        '<button type="button" class="btn" data-close>閉じる</button></div>');
      el('eaSave').onclick = function () {
        var f = el('eaform').elements;
        api('apiEventAddEntry', [st.evId, { memberId: f.memberId.value, name: f.name.value, kind: f.kind.value,
          org: f.org.value, tel: f.tel.value, note: f.note.value }], function (res) {
          hideModal(); toast('追加しました'); st.evDetail = res; drawEventDetail();
        });
      };
    });
  }

  function loadFee(fy) {
    api('apiFeeYear', [fy || ''], function (res) {
      st.fee = res;
      st.feeFy = res.fy;
      if (!st.feeYm || res.months.indexOf(st.feeYm) === -1) {
        st.feeYm = res.months.indexOf(res.today.slice(0, 7)) !== -1 ? res.today.slice(0, 7) : res.months[0];
      }
      if (st.view === 'fee') { drawFee(); drawFeeSettings(); }
    }, true);
  }

  function drawFee() {
    if (!st.fee) return;
    el('fbody').className = '';
    if (st.feeMode === 'year') drawFeeYear(); else drawFeeMonth();
  }

  /** 会員の未納の月数と金額（今月まで）。 */
  function unpaidOf(m) {
    var n = m.cells.filter(function (c) { return c.state === 'unpaid'; }).length;
    return { n: n, amount: m.fee == null ? null : n * m.fee };
  }

  function drawFeeYear() {
    var f = st.fee;
    var list = f.members.filter(function (m) { return !st.feeUnpaidOnly || unpaidOf(m).n; }).sort(cmpKana);
    var total = 0, unknown = 0;
    f.members.forEach(function (m) { var u = unpaidOf(m); if (u.amount == null) unknown += u.n; else total += u.amount; });

    el('fbody').innerHTML = '<div class="card"><div class="row" style="margin-bottom:10px">' +
      '<button type="button" class="nav" data-fy="-1" aria-label="前の年度">‹</button><b>' + f.fy + '年度</b>' +
      '<button type="button" class="nav" data-fy="1" aria-label="次の年度">›</button><span class="grow"></span>' +
      '<span class="muted">未納合計 <b style="color:var(--ng)">' + yen(total) + '</b>' + (unknown ? '（ほか金額未設定 ' + unknown + '件）' : '') + '</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th>氏名</th><th>区分</th>' +
      f.months.map(function (ym) { return '<th class="num" style="text-align:center">' + Number(ym.slice(5)) + '月</th>'; }).join('') +
      '<th class="num">未納</th></tr></thead><tbody>' +
      list.map(function (m) {
        var u = unpaidOf(m);
        return '<tr><td><a href="#" data-member="' + esc(m.id) + '">' + esc(m.name) + '</a>' +
          (m.state !== '在籍' ? ' <span class="tag">' + esc(m.state) + '</span>' : '') + '</td><td>' + esc(m.kubun) + '</td>' +
          m.cells.map(function (c, i) { return '<td class="fcell">' + feeCell(m, i) + '</td>'; }).join('') +
          '<td class="num">' + (u.n ? '<b style="color:var(--ng)">' + u.n + 'か月 ' + (u.amount == null ? '' : yen(u.amount)) + '</b>' : '') + '</td></tr>';
      }).join('') +
      '<tr class="total"><td colspan="2">入金 / 未納（人）</td>' + f.months.map(function (ym, i) {
        var paid = 0, un = 0;
        f.members.forEach(function (m) { if (m.cells[i].state === 'paid') paid++; if (m.cells[i].state === 'unpaid') un++; });
        return '<td class="num" style="text-align:center">' + (paid || un ? paid + '/' + (un ? '<b style="color:var(--ng)">' + un + '</b>' : 0) : '') + '</td>';
      }).join('') + '<td></td></tr>' +
      '</tbody></table></div>' +
      '<div class="legend"><span class="fc paid" style="display:inline-block;line-height:28px;text-align:center">✓</span>入金済 ' +
      '<span class="fc unpaid" style="display:inline-block;line-height:26px;text-align:center">未</span>未納（押すと入金登録） ' +
      '<span class="fc exempt" style="display:inline-block;line-height:28px;text-align:center">免</span>免除　休＝休会　－＝無料　点線＝先の月（前払いの登録ができます）</div></div>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-fy]'), function (b) {
      b.onclick = function () { loadFee(st.feeFy + Number(b.getAttribute('data-fy'))); };
    });
    bindFeeCells();
  }

  function feeCell(m, i) {
    var c = m.cells[i];
    var title = c.state === 'paid' ? c.date + ' ' + c.method + ' ' + yen(c.amount) : (FEE_LABEL[c.state] || '');
    return '<button type="button" class="fc ' + c.state + '" data-fcell="' + esc(m.id) + ':' + i + '" title="' + esc(title) + '">' +
      FEE_MARK[c.state] + '</button>';
  }

  function bindFeeCells() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-fcell]'), function (b) {
      b.onclick = function () {
        var p = b.getAttribute('data-fcell').split(':');
        var m = st.fee.members.filter(function (x) { return x.id === p[0]; })[0];
        var i = Number(p[1]);
        var c = m.cells[i];
        if (c.state === 'paid' || c.state === 'exempt') return feeDetail(m, st.fee.months[i], c);
        if (c.state !== 'unpaid' && c.state !== 'future') return;
        // その会員の未納・先の月を並べ、押した月だけチェックを付けます
        var items = [];
        m.cells.forEach(function (x, j) {
          if (x.state === 'unpaid' || x.state === 'future') {
            items.push({ memberId: m.id, name: m.name, ym: st.fee.months[j], amount: m.fee, checked: j === i });
          }
        });
        payDialog(items, function () { loadFee(st.feeFy); });
      };
    });
  }

  function drawFeeMonth() {
    var f = st.fee;
    var i = f.months.indexOf(st.feeYm);
    var rows = f.members.map(function (m) { return { m: m, c: m.cells[i] }; })
      .filter(function (r) { return r.c.state !== 'none'; })
      .filter(function (r) { return !st.feeUnpaidOnly || r.c.state === 'unpaid'; })
      .sort(function (a, b) { return cmpKana(a.m, b.m); });
    var paid = 0, paidSum = 0, un = 0, unSum = 0;
    f.members.forEach(function (m) {
      var c = m.cells[i];
      if (c.state === 'paid') { paid++; paidSum += Number(c.amount) || 0; }
      if (c.state === 'unpaid') { un++; unSum += m.fee || 0; }
    });

    el('fbody').innerHTML = '<div class="card"><div class="row" style="margin-bottom:10px">' +
      '<button type="button" class="nav" data-fm="-1" aria-label="前の月">‹</button><b style="font-size:18px">' +
      st.feeYm.slice(0, 4) + '年' + Number(st.feeYm.slice(5)) + '月</b>' +
      '<button type="button" class="nav" data-fm="1" aria-label="次の月">›</button></div>' +
      '<div class="stats" style="margin-bottom:12px">' + stat('入金', paid + '人') + stat('入金額', yen(paidSum)) +
      stat('未納', un + '人') + stat('未納額', yen(unSum)) + '</div>' +
      '<div class="row" style="margin-bottom:8px"><button type="button" class="btn sm" id="fBulk">チェックした人をまとめて入金OK</button>' +
      '<span class="muted">道場で現金を受け取ったときなどに使います</span></div>' +
      '<div class="tbl-wrap"><table><thead><tr><th></th><th>氏名</th><th>区分</th><th class="num">月額</th><th>状態</th><th></th></tr></thead><tbody>' +
      rows.map(function (r) {
        var m = r.m, c = r.c, j = f.members.indexOf(m);
        var state = c.state === 'paid' ? '<span class="tag ok">✓ ' + esc(c.date.slice(5).replace('-', '/')) + ' ' + esc(c.method) + '</span>'
          : c.state === 'exempt' ? '<span class="tag">免除</span>'
          : c.state === 'unpaid' ? '<span class="tag ng">未納</span>'
          : '<span class="muted">' + esc(FEE_LABEL[c.state] || '') + '</span>';
        var action = c.state === 'unpaid' || c.state === 'future'
          ? '<button type="button" class="btn sm pri" data-fcell="' + esc(m.id) + ':' + i + '">入金OK</button>'
          : (c.state === 'paid' || c.state === 'exempt') ? '<button type="button" class="btn sm" data-fcell="' + esc(m.id) + ':' + i + '">詳細</button>' : '';
        return '<tr><td>' + (c.state === 'unpaid' || c.state === 'future' ? '<input type="checkbox" data-fpick="' + j + '" aria-label="' + esc(m.name) + 'を選ぶ">' : '') +
          '</td><td><a href="#" data-member="' + esc(m.id) + '">' + esc(m.name) + '</a></td><td>' + esc(m.kubun) + '</td>' +
          '<td class="num">' + (m.fee == null ? '<span class="muted">未設定</span>' : yen(m.fee)) + '</td><td>' + state + '</td><td>' + action + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-fm]'), function (b) {
      b.onclick = function () {
        var next = shiftYm(st.feeYm, Number(b.getAttribute('data-fm')));
        st.feeYm = next;
        if (f.months.indexOf(next) === -1) loadFee(st.feeFy + (next < f.months[0] ? -1 : 1));
        else drawFeeMonth();
      };
    });
    el('fBulk').onclick = function () {
      var items = Array.prototype.map.call(document.querySelectorAll('[data-fpick]:checked'), function (cb) {
        var m = f.members[Number(cb.getAttribute('data-fpick'))];
        return { memberId: m.id, name: m.name, ym: st.feeYm, amount: m.fee, checked: true };
      });
      if (!items.length) return toast('入金OKにする人にチェックを付けてください', true);
      payDialog(items, function () { loadFee(st.feeFy); });
    };
    bindFeeCells();
  }

  /**
   * 入金の登録画面。items = [{name, ym または label, amount, checked, ...}]
   * submit を渡すと、その関数で送ります（イベントの参加費など）。省略時は月会費として送ります。
   */
  function payDialog(items, done, submit) {
    var today = st.boot.today;
    var methods = (st.fee && st.fee.methods) || ['現金', '振込', 'QR', '口座振替'];
    showModal('<h2>入金の登録</h2><div class="tbl-wrap"><table><thead><tr><th></th><th>氏名</th><th>内容</th><th class="num">金額</th></tr></thead><tbody>' +
      items.map(function (it, k) {
        return '<tr><td><input type="checkbox" data-pi="' + k + '"' + (it.checked ? ' checked' : '') + '></td><td>' + esc(it.name) + '</td>' +
          '<td>' + esc(it.label || Number(it.ym.slice(5)) + '月') + '</td><td class="num"><input type="text" inputmode="numeric" data-pa="' + k + '" value="' +
          (it.amount == null ? '' : it.amount) + '" placeholder="金額" style="width:90px;text-align:right"></td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<form id="pform" class="form" style="margin-top:12px">' +
      '<label>入金日<input type="date" name="date" value="' + today + '"></label>' +
      '<label>支払方法<select name="method">' + methods.map(function (x) { return opt(x, x, '現金'); }).join('') + '</select></label>' +
      '<label class="wide">備考<input type="text" name="note"></label></form>' +
      '<div class="row" style="margin-top:14px"><button type="button" class="btn pri" id="pOk">入金OK</button>' +
      '<button type="button" class="btn" id="pExempt">免除にする</button><span class="grow"></span>' +
      '<button type="button" class="btn" data-close>閉じる</button></div>');

    function picked(needAmount) {
      var out = [];
      items.forEach(function (it, k) {
        if (!document.querySelector('[data-pi="' + k + '"]').checked) return;
        var a = document.querySelector('[data-pa="' + k + '"]').value.replace(/[,，円\s]/g, '');
        out.push({ memberId: it.memberId, ym: it.ym, entryId: it.entryId, amount: a });
      });
      if (!out.length) { toast('登録する月にチェックを付けてください', true); return null; }
      if (needAmount && out.some(function (x) { return !(Number(x.amount) > 0); })) { toast('金額を入力してください', true); return null; }
      return out;
    }
    function send(entries, exempt) {
      var f = el('pform').elements;
      var call = submit ? submit(entries, f.date.value, f.method.value, f.note.value, exempt)
        : ['apiFeePay', [entries, f.date.value, f.method.value, f.note.value, exempt]];
      api(call[0], call[1], function (res) {
        hideModal();
        toast((exempt ? '免除にしました' : '入金を登録しました') + '（' + res.done + '件）' +
          (res.skipped.length ? '　登録済みのため飛ばしたもの：' + res.skipped.join('、') : ''), !!res.skipped.length);
        done(res);
      });
    }
    el('pOk').onclick = function () { var e = picked(true); if (e) send(e, false); };
    el('pExempt').onclick = function () {
      var e = picked(false);
      if (e && confirm('選んだ月を「免除」（会費をもらわない）にします。よろしいですか？')) send(e, true);
    };
  }

  /** 入金済・免除のマスを押したとき：内容の表示と取り消し。 */
  function feeDetail(m, ym, c) {
    showModal('<h2>' + esc(m.name) + '　' + ym.slice(0, 4) + '年' + Number(ym.slice(5)) + '月分</h2>' +
      '<div class="tbl-wrap"><table><tbody>' +
      [['状態', c.state === 'paid' ? '入金済' : '免除'], ['金額', yen(c.amount)], ['入金日', c.date], ['支払方法', c.method],
       ['受領者', c.receiver], ['備考', c.note]].map(function (r) {
        return '<tr><th style="position:static">' + r[0] + '</th><td style="white-space:normal">' + esc(r[1] || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="row" style="margin-top:14px"><button type="button" class="btn" id="fCancel" style="color:var(--ng)">この記録を取り消す</button>' +
      '<span class="grow"></span><button type="button" class="btn" data-close>閉じる</button></div>' +
      '<div class="legend">間違えて登録したときに使います。記録は消えずに「取消」として残ります。</div>');
    el('fCancel').onclick = function () {
      if (!confirm('この記録を取り消して、未納に戻します。よろしいですか？')) return;
      api('apiFeeCancel', [c.row], function () { hideModal(); toast('取り消しました'); loadFee(st.feeFy); });
    };
  }

  function drawFeeSettings() {
    var f = st.fee;
    var kubuns = f.kubuns.slice();
    Object.keys(f.fee).forEach(function (k) { if (kubuns.indexOf(k) === -1) kubuns.push(k); });
    el('fsetBody').innerHTML = '<form id="fsform" class="form">' + kubuns.map(function (k) {
      var v = f.fee[k];
      return '<label>' + esc(k) + '（月額・円）<input type="text" inputmode="numeric" name="' + esc(k) + '" value="' + (v == null ? '' : v) + '" placeholder="未設定"></label>';
    }).join('') + '</form><div class="row" style="margin-top:10px"><button type="button" class="btn pri" id="fsSave">保存する</button>' +
      '<span class="muted">空欄にすると「未設定」になり、入金のときに金額を入力します。無料は 0 にします。</span></div>';
    el('fsSave').onclick = function () {
      var table = {};
      kubuns.forEach(function (k) { table[k] = el('fsform').elements[k].value; });
      api('apiFeeSettingsSave', [table], function () { toast('保存しました'); loadFee(st.feeFy); });
    };
  }

  /** 会員個人管理の「会費」タブ：未納の月と履歴。 */
  function drawMemberFee() {
    el('mbody').innerHTML = '<div class="card muted">読み込み中…</div>';
    api('apiFeeHistory', [st.member.id], function (res) {
      if (st.view !== 'member' || st.memberTab !== 'fee') return;
      var name = fieldValue('氏名');
      el('mbody').innerHTML = '<div class="card"><div class="row"><span>会費区分：<b>' + esc(res.kubun || '未設定') + '</b>　月額：<b>' +
        (res.fee == null ? '未設定' : yen(res.fee)) + '</b></span><span class="grow"></span>' +
        (res.unpaid.length ? '<button type="button" class="btn pri" id="mfPay">入金を登録</button>' : '') + '</div>' +
        '<div style="margin-top:10px">今年度の未納：' + (res.unpaid.length
          ? res.unpaid.map(function (ym) { return '<span class="tag ng">' + Number(ym.slice(5)) + '月</span>'; }).join(' ') + '　<b style="color:var(--ng)">' +
            (res.fee == null ? res.unpaid.length + 'か月' : yen(res.fee * res.unpaid.length)) + '</b>'
          : '<span class="tag ok">なし</span>') + '</div></div>' +
        '<div class="card"><h2>納入の履歴</h2>' + (res.history.length ? '<div class="tbl-wrap"><table><thead><tr><th>対象月</th><th class="num">金額</th><th>入金日</th><th>方法</th><th>状態</th><th>受領者</th><th>備考</th></tr></thead><tbody>' +
          res.history.map(function (h) {
            var cls = h.state === '入金済' ? 'ok' : h.state === '未納' ? 'ng' : '';
            return '<tr><td>' + esc(h.ym.slice(0, 4) + '年' + Number(h.ym.slice(5)) + '月') + '</td><td class="num">' + yen(h.amount) + '</td><td>' + esc(h.date) +
              '</td><td>' + esc(h.method) + '</td><td><span class="tag ' + cls + '">' + esc(h.state) + '</span></td><td>' + esc(h.receiver) +
              '</td><td style="white-space:normal">' + esc(h.note) + '</td></tr>';
          }).join('') + '</tbody></table></div>' : '<span class="muted">記録がありません。</span>') + '</div>';
      if (el('mfPay')) el('mfPay').onclick = function () {
        payDialog(res.unpaid.map(function (ym, k) {
          return { memberId: st.member.id, name: name, ym: ym, amount: res.fee, checked: k === 0 };
        }), drawMemberFee);
      };
    }, true);
  }

  function showModal(html) {
    el('modal').innerHTML = '<div class="card" role="dialog" aria-modal="true">' + html + '</div>';
    el('modal').hidden = false;
    Array.prototype.forEach.call(el('modal').querySelectorAll('[data-close]'), function (b) { b.onclick = hideModal; });
  }
  function hideModal() { el('modal').hidden = true; el('modal').innerHTML = ''; }
  el('modal').addEventListener('click', function (ev) { if (ev.target === el('modal')) hideModal(); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !el('modal').hidden) hideModal(); });

  function yen(n) {
    if (n === '' || n == null || isNaN(Number(n))) return '';
    return Number(n).toLocaleString('ja-JP') + '円';
  }

  // ------------------------------------------------------------
  // 利用者管理
  // ------------------------------------------------------------
  var ROLE_NOTE = {
    '管理者': 'すべての画面と利用者の登録',
    '事務':   '会員（個人情報を含む）の登録・編集、進級、出欠、徴収、物販',
    '会計':   '徴収管理と会員の基本情報',
    '指導者': '会員の基本情報（住所・電話などは見えません）、進級の登録、出欠',
  };

  function renderUsers() {
    el('view').innerHTML = '<div class="card"><h2>利用者を登録する</h2><form id="uform" class="form">' +
      '<label>Googleアカウント（メールアドレス）<input type="email" name="email" placeholder="example@gmail.com"></label>' +
      '<label>氏名<input type="text" name="name"></label>' +
      '<label>役割<select name="role">' + st.boot.roles.map(function (r) { return opt(r, r, '指導者'); }).join('') + '</select></label>' +
      '<label>状態<select name="state">' + opt('有効', '有効', '有効') + opt('停止', '停止', '') + '</select></label>' +
      '</form><div class="row" style="margin-top:12px"><button type="button" class="btn pri" id="usave">保存する</button>' +
      '<span class="muted">登録済みのメールアドレスを入れると、その人の内容を上書きします。</span></div>' +
      '<h3>役割でできること</h3><div class="tbl-wrap"><table><tbody>' + Object.keys(ROLE_NOTE).map(function (r) {
        return '<tr><th style="position:static">' + r + '</th><td style="white-space:normal">' + ROLE_NOTE[r] + '</td></tr>';
      }).join('') + '</tbody></table></div></div>' +
      '<div class="card"><h2>利用者一覧</h2><div id="ulist" class="muted">読み込み中…</div></div>';

    el('usave').onclick = function () {
      var f = el('uform').elements;
      api('apiPortalUserSave', [{ email: f.email.value, name: f.name.value, role: f.role.value, state: f.state.value }], function (res) {
        st.users = res.users;
        el('uform').reset();
        toast('保存しました');
        drawUsers();
      });
    };
    api('apiPortalUsers', [], function (res) { st.users = res.users; if (st.view === 'users') drawUsers(); }, true);
  }

  function drawUsers() {
    el('ulist').innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>メールアドレス</th><th>氏名</th><th>役割</th><th>状態</th><th>最終利用</th><th></th></tr></thead><tbody>' +
      st.users.map(function (u, i) {
        return '<tr><td>' + esc(u.email) + '</td><td>' + esc(u.name) + '</td><td>' + esc(u.role) + '</td><td>' +
          '<span class="tag ' + (u.state === '有効' ? 'ok' : 'ng') + '">' + esc(u.state) + '</span></td><td>' + esc(u.lastSeen) +
          '</td><td><button type="button" class="btn sm" data-uedit="' + i + '">直す</button></td></tr>';
      }).join('') + '</tbody></table></div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-uedit]'), function (btn) {
      btn.onclick = function () {
        var u = st.users[Number(btn.getAttribute('data-uedit'))];
        var f = el('uform').elements;
        f.email.value = u.email; f.name.value = u.name; f.role.value = u.role; f.state.value = u.state;
        window.scrollTo(0, 0);
      };
    });
  }

  // ------------------------------------------------------------
  // カレンダー（範囲指定つき）
  // ------------------------------------------------------------
  function calendar(box, ym, o) {
    var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
    var first = new Date(y, m - 1, 1).getDay();
    var last = new Date(y, m, 0).getDate();
    var cells = '';
    for (var i = 0; i < first; i++) cells += '<div class="cell blank"></div>';
    for (var d = 1; d <= last; d++) {
      var key = ym + '-' + pad(d);
      var dow = (first + d - 1) % 7;
      var cls = ['cell'];
      if (dow === 0) cls.push('sun');
      if (dow === 6) cls.push('sat');
      if (o.sess && o.sess[key]) cls.push('sess');
      if (o.pick === key || (!o.pick && o.range && (key === o.range.from || key === o.range.to))) cls.push('edge');
      else if (!o.pick && o.range && key > o.range.from && key < o.range.to) cls.push('inr');
      cells += '<button type="button" class="' + cls.join(' ') + '" data-day="' + key + '"><span class="d">' + d + '</span>' +
        (o.mark ? o.mark(key) : '') + '</button>';
    }
    box.innerHTML = '<div class="cal-head"><button type="button" class="nav" data-cnav="-1" aria-label="前の月">‹</button>' +
      '<b>' + y + '年' + m + '月</b><button type="button" class="nav" data-cnav="1" aria-label="次の月">›</button></div>' +
      '<div class="cal"><div class="dow">' + WEEK.map(function (w) { return '<div>' + w + '</div>'; }).join('') + '</div>' +
      '<div class="grid">' + cells + '</div></div>' +
      (o.pick ? '<div class="legend">開始日：' + esc(dateLabel(o.pick)) + '　→ 終了日を押してください</div>' : '');
    Array.prototype.forEach.call(box.querySelectorAll('[data-cnav]'), function (b) {
      b.onclick = function () { o.onNav(shiftYm(ym, Number(b.getAttribute('data-cnav')))); };
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-day]'), function (b) {
      b.onclick = function () { o.onPick(b.getAttribute('data-day')); };
    });
  }

  /** よく使う期間のボタン。 */
  function presetButtons(prefix) {
    return '<div class="row">' + [['month', '今月'], ['prev', '先月'], ['3m', '直近3か月'], ['fy', '今年度']].map(function (p) {
      return '<button type="button" class="btn sm" data-preset="' + prefix + ':' + p[0] + '">' + p[1] + '</button>';
    }).join('') + '</div>';
  }

  function bindPresets(prefix, fn) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-preset^="' + prefix + ':"]'), function (b) {
      b.onclick = function () {
        var t = st.boot.today, ym = t.slice(0, 7), kind = b.getAttribute('data-preset').split(':')[1];
        if (kind === 'month') fn({ from: ym + '-01', to: monthEnd(ym) });
        if (kind === 'prev') fn({ from: shiftYm(ym, -1) + '-01', to: monthEnd(shiftYm(ym, -1)) });
        if (kind === '3m') fn({ from: shiftYm(ym, -2) + '-01', to: monthEnd(ym) });
        if (kind === 'fy') {
          var y = Number(t.slice(0, 4)) - (Number(t.slice(5, 7)) < 4 ? 1 : 0);
          fn({ from: y + '-04-01', to: (y + 1) + '-03-31' });
        }
      };
    });
  }

  // ------------------------------------------------------------
  // 小道具
  // ------------------------------------------------------------
  /**
   * Apps Script の操作を呼びます。1つ目の引数には必ずログイン情報を付けます。
   * text/plain で送るのは、ブラウザの事前確認（CORS preflight）を避けるためです。
   */
  function api(name, args, ok, quiet) {
    if (!quiet) el('busy').hidden = false;
    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ api: name, args: [{ idToken: st.token }].concat(args) }),
    }).then(function (r) { return r.json(); }).then(function (res) {
      el('busy').hidden = true;
      if (res.ok) return ok(res);
      if (res.code === 'auth') return showSignIn(res.message);
      if (res.code === 'denied') {
        google.accounts.id.disableAutoSelect();
        return showSignIn(res.message);
      }
      toast(res.message || 'エラーが発生しました', true);
    }).catch(function () {
      el('busy').hidden = true;
      toast('通信できませんでした。もう一度お試しください。', true);
    });
  }

  function loadMembers(fn, force) {
    if (st.members && !force) return fn();
    api('apiMemberList', [], function (res) { st.members = res.members; fn(); }, true);
  }

  var toastTimer;
  function toast(msg, ng) {
    var t = el('toast');
    t.textContent = msg;
    t.className = 'toast' + (ng ? ' ng' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, ng ? 6000 : 2500);
  }

  function gate(title, msg) {
    el('app').hidden = true;
    el('gate').hidden = false;
    el('gateMsg').innerHTML = '<b>' + esc(title) + '</b><br>' + esc(msg);
  }

  function el(id) { return document.getElementById(id); }
  function pad(n) { return ('0' + n).slice(-2); }
  function opt(v, label, cur) { return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(label) + '</option>'; }
  function stat(label, n) { return '<div class="stat"><small>' + esc(label) + '</small><b>' + esc(n) + '</b></div>'; }
  function cmpKana(a, b) { return String(a.kana || a.name).localeCompare(String(b.kana || b.name), 'ja'); }
  function minStr(a, b) { return a < b ? a : b; }
  function maxStr(a, b) { return a > b ? a : b; }
  function shiftYm(ym, n) {
    var d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  }
  function monthEnd(ym) { return ym + '-' + pad(new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0).getDate()); }
  function dateLabel(k) {
    var d = new Date(k.replace(/-/g, '/'));
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  start();
})();
</script>
</body>
