<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>武仁舘 稽古の予約</title>
<!--STYLE-->
<style>
  /* 構成：紺のヘッダー／月カレンダー（または一覧）／下部に確定ボタン。出欠画面と同じ紺を基調にする */
  :root{
    --navy:#1F3A5F; --navy-soft:#e8eef6; --ink:#1d2330; --sub:#687182;
    --line:#dfe3ea; --bg:#f5f6f8; --card:#ffffff; --head-sub:#c8d4e8;
    --add:#137a4a; --add-soft:#e3f3ea; --cxl:#b42323; --cxl-soft:#fbe9e9;
    --muted:#a3aab6; --sun:#c0392b; --sat:#2563a8; --overlay:rgba(15,23,35,.45);
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#8fb2e0; --navy-soft:#1c2a3d; --ink:#e6e9ef; --sub:#9aa3b2;
      --line:#2c3440; --bg:#11151b; --card:#1a1f27; --head-sub:#9fb3cf;
      --add:#4cc38a; --add-soft:#16301f; --cxl:#f07070; --cxl-soft:#3a1d1d;
      --muted:#5d6572; --sun:#f08a7e; --sat:#7fb0ea; --overlay:rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#8fb2e0; --navy-soft:#1c2a3d; --ink:#e6e9ef; --sub:#9aa3b2;
    --line:#2c3440; --bg:#11151b; --card:#1a1f27; --head-sub:#9fb3cf;
    --add:#4cc38a; --add-soft:#16301f; --cxl:#f07070; --cxl-soft:#3a1d1d;
    --muted:#5d6572; --sun:#f08a7e; --sat:#7fb0ea; --overlay:rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       font-size:15px;line-height:1.5;padding-bottom:96px}
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

  .hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1F3A5F;color:#fff;
       padding:10px 16px}
  .hdr h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.04em}
  .hdr .who{font-size:12px;color:var(--head-sub);margin-top:1px}

  .wrap{padding:12px 16px 0;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

  .banner{background:var(--cxl-soft);color:var(--cxl);border-radius:10px;padding:10px 12px;font-size:13px}

  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .month{display:flex;align-items:center;gap:4px}
  .month h2{margin:0;font-size:20px;font-weight:700;min-width:5.5em;text-align:center;
            font-variant-numeric:tabular-nums}
  .month small{display:block;font-size:11px;font-weight:400;color:var(--sub)}
  .nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);
       cursor:pointer;font-size:16px;line-height:1}
  .nav:disabled{opacity:.3;cursor:default}

  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--sub)}
  .seg button[aria-pressed="true"]{background:var(--navy);color:var(--card);font-weight:700}

  /* カレンダー */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .dow div{font-size:11px;text-align:center;padding:6px 0;color:var(--sub);border-bottom:1px solid var(--line)}
  .dow div:first-child{color:var(--sun)} .dow div:last-child{color:var(--sat)}
  .cell{min-height:66px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
        padding:4px 3px;display:flex;flex-direction:column;gap:3px;background:transparent;
        border-top:0;border-left:0;text-align:left;cursor:default;min-width:0}
  .grid .cell:nth-child(7n){border-right:0}
  .cell .d{font-size:12px;font-variant-numeric:tabular-nums;padding-left:2px}
  .cell.sun .d{color:var(--sun)} .cell.sat .d{color:var(--sat)}
  .cell.past .d,.cell.blank .d{color:var(--muted)}
  .cell.today .d{display:inline-block;background:var(--navy);color:var(--card);border-radius:999px;
                 padding:0 6px;align-self:flex-start}
  .cell.has{cursor:pointer}
  .cell.has:active{background:var(--navy-soft)}

  .pill{display:block;font-size:10px;line-height:1.2;border-radius:5px;padding:3px 2px;text-align:center;
        font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        border:1px solid var(--navy);color:var(--navy);background:var(--card)}
  .pill.booked{background:var(--navy);color:var(--card)}
  .pill.adding{background:var(--add);border-color:var(--add);color:var(--card)}
  .pill.removing{background:var(--cxl-soft);border-color:var(--cxl);color:var(--cxl);text-decoration:line-through}
  .pill.off{border-color:var(--line);color:var(--muted);background:transparent}
  .pill.more{border:0;color:var(--sub);background:transparent;padding:0}

  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--sub);padding:2px 2px 0}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:14px;height:10px;border-radius:3px;border:1px solid var(--navy)}
  .legend i.booked{background:var(--navy)}
  .legend i.adding{background:var(--add);border-color:var(--add)}
  .legend i.removing{background:var(--cxl-soft);border-color:var(--cxl)}
  .legend i.off{border-color:var(--line)}

  /* 一覧 */
  .list{display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
       border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;text-align:left}
  .row.adding{border-color:var(--add);background:var(--add-soft)}
  .row.removing{border-color:var(--cxl);background:var(--cxl-soft)}
  .row.off{cursor:default}
  .row .date{flex:0 0 3.6em;text-align:center;line-height:1.15}
  .row .date b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .row .date span{font-size:11px;color:var(--sub)}
  .row .date.sun span{color:var(--sun)} .row .date.sat span{color:var(--sat)}
  .row .info{flex:1;min-width:0}
  .row .t{font-weight:700;font-variant-numeric:tabular-nums}
  .row .s{font-size:12px;color:var(--sub)}
  .row.off .t,.row.off .date b{color:var(--muted)}
  .chk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);
       display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:transparent}
  .chk.on{background:var(--navy);color:var(--card)}
  .chk.add{background:var(--add);border-color:var(--add);color:var(--card)}
  .chk.cxl{border-color:var(--cxl);color:var(--cxl)}
  .chk.off{border-color:var(--line)}
  .tag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;
       vertical-align:1px;background:var(--navy-soft);color:var(--navy)}
  .tag.add{background:var(--add);color:var(--card)} .tag.cxl{background:var(--cxl);color:var(--card)}
  .tag.off{background:transparent;border:1px solid var(--line);color:var(--muted)}

  .note{font-size:12px;color:var(--sub)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;
         text-align:center;color:var(--sub);font-size:13px}

  /* 下部 */
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
        padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  .foot .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .foot .sum{flex:1;font-size:12px;color:var(--sub);min-width:0}
  .foot .sum b{color:var(--ink);font-size:14px}
  .btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--navy);color:var(--card)}
  .btn.primary:disabled{background:var(--line);color:var(--muted);cursor:default}
  .btn.ghost{background:var(--navy-soft);color:var(--navy)}

  /* シート（下から出るパネル） */
  .ov{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:82%;
         overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
  .sheet h3{margin:0;font-size:16px}
  .sheet .grp h4{margin:0 0 6px;font-size:12px;color:var(--sub);font-weight:700;letter-spacing:.04em}
  .sheet ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .sheet li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  .sheet li.ng{border-color:var(--cxl);color:var(--cxl)}
  .sheet li small{display:block;font-size:12px;color:var(--sub)}
  .sheet .acts{display:flex;gap:8px}
  .sheet .acts .btn{flex:1}

  .busy{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:center;justify-content:center}
  .busy div{background:var(--card);border-radius:12px;padding:18px 22px;font-size:14px}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);
         padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;
         pointer-events:none;z-index:70;max-width:90%;text-align:center}
  .toast.show{opacity:.95}
  .gate{padding:40px 16px;text-align:center;color:var(--sub);font-size:14px}
  .gate b{display:block;color:var(--ink);font-size:15px;margin-bottom:8px}
  @media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
<!--/STYLE-->
</head>
<body>
<!--BODY-->
<header class="hdr">
  <h1>武仁舘 稽古の予約</h1>
  <div class="who" id="who">読み込み中…</div>
</header>

<main id="app" hidden>
  <div class="wrap">
    <div class="banner" id="paused" hidden>現在は休会中のため予約できません。復帰の際は道場までご連絡ください。</div>

    <div class="top">
      <div class="month">
        <button class="nav" id="prev" aria-label="前の月">‹</button>
        <h2 id="mon"></h2>
        <button class="nav" id="next" aria-label="次の月">›</button>
      </div>
      <div class="seg" role="group" aria-label="表示の切り替え">
        <button id="vCal" aria-pressed="true">カレンダー</button>
        <button id="vList" aria-pressed="false">一覧</button>
      </div>
    </div>

    <div id="calView">
      <div class="cal">
        <div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="legend" style="margin-top:8px">
        <span><i></i>受付中</span>
        <span><i class="booked"></i>予約済み</span>
        <span><i class="adding"></i>これから予約</span>
        <span><i class="removing"></i>これから取消</span>
      </div>
    </div>

    <div class="list" id="listView" hidden></div>

    <p class="note" id="deadline"></p>
  </div>
</main>

<footer class="foot" id="foot" hidden>
  <div class="in">
    <div class="sum" id="sum"></div>
    <button class="btn primary" id="apply" disabled>確定する</button>
  </div>
</footer>

<div class="gate" id="gate">読み込み中…</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status"></div>
<!--/BODY-->

<!--LIFF--><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><!--/LIFF-->
<!--MOCK-->
<!--SCRIPT-->
<script>
  // 予約の処理をする Apps Script のURL（デプロイIDが変わらない限りこのまま）
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbza_1ROShhfxcEoDEoqIKYxcNBIFTsSvIeJhAZ57XaZF13R5By0ogD_t6dtzMutRHzm9g/exec';
  var LIFF_ID = '';   // 起動時に Apps Script から受け取ります（スクリプトプロパティ LIFF_BOOK_ID）
  var WEEK = ['日', '月', '火', '水', '木', '金', '土'];

  var auth = null;
  var st = {
    data: null,      // サーバーから受け取った一覧
    months: [],      // 'yyyy-MM' の並び
    mi: 0,           // 表示中の月
    view: 'cal',
    want: {},        // 稽古日ID → 予約したい(true)/したくない(false)。未操作は含めない
  };

  // ------------------------------------------------------------
  // 起動
  // ------------------------------------------------------------
  // 読み込みが止まったとき、どの段階で止まったかを画面に出すための記録
  var stage = '';
  var stageTimer = null;
  function step(label) {
    stage = label;
    el('gate').innerHTML = '<b>読み込み中…</b>' + esc(label);
    clearTimeout(stageTimer);
    stageTimer = setTimeout(function () {
      gate('読み込みが終わりません',
        '止まった段階：' + stage + '\n\n' +
        '【道場への連絡用】\n' + diag() + '\n\n' +
        'この画面を撮影して、道場にお知らせください。');
    }, 20000);
  }
  function stepDone() { clearTimeout(stageTimer); stage = ''; }
  function diag() {
    var inClient = '不明';
    try { inClient = (window.liff && liff.isInClient) ? String(liff.isInClient()) : 'SDKなし'; } catch (e) {}
    return 'host=' + location.host + ' / LINE内=' + inClient +
      ' / LIFF_ID=' + (LIFF_ID ? LIFF_ID.slice(0, 6) + '…' : '未設定');
  }

  function boot() {
    if (window.BOOKING_MOCK) { auth = { mock: true }; load(); return; }
    if (!window.liff) { gate('LINEの部品を読み込めませんでした', '電波の良い場所で開き直してください。\n' + diag()); return; }

    // Apps Script は最初の呼び出しが遅いので、ここで先に起こしておく意味もあります
    step('① 道場のシステムに接続しています');
    fetch(GAS_URL + '?api=config').then(function (r) { return r.json(); }).then(function (cfg) {
      LIFF_ID = cfg.liffId || '';
      if (!LIFF_ID) {
        stepDone();
        gate('予約画面はまだ準備中です', '道場の設定が済むまでお待ちください。\n' + diag());
        return;
      }
      initLiff();
    }).catch(function (e) {
      stepDone();
      gate('道場のシステムに接続できませんでした', '電波の良い場所で開き直してください。\n' + String(e));
    });
  }

  function initLiff() {
    step('② LINEに接続しています');
    liff.init({ liffId: LIFF_ID }).then(function () {
      step('③ LINEのログインを確認しています');
      if (!liff.isLoggedIn()) { liff.login(); return; }
      auth = { idToken: liff.getIDToken(), accessToken: liff.getAccessToken() };
      if (!auth.idToken && !auth.accessToken) {
        stepDone();
        gate('LINEのログイン情報を受け取れませんでした', diag());
        return;
      }
      load();
    }).catch(function (e) {
      stepDone();
      gate('LINEの読み込みに失敗しました', String(e && e.message ? e.message : e) + '\n' + diag());
    });
  }

  function load() {
    if (!window.BOOKING_MOCK) step('④ 予約の情報を読み込んでいます');
    api('apiBookingBootstrap', [auth], function (res) {
      stepDone();
      if (!res.ok) { gate('開けませんでした', res.message); return; }
      setData(res.data, true);
      el('gate').hidden = true;
      el('app').hidden = false;
      el('foot').hidden = false;
    }, function (e) {
      stepDone();
      gate('通信に失敗しました', '電波の良い場所で開き直してください。\n' + String(e && e.message ? e.message : e));
    });
  }

  function setData(data, first) {
    // 締切・満席の回は表示しません（自分が予約済みの回は、確認できるよう残します）
    data.sessions = data.sessions.filter(function (s) {
      return s.reserved || !(s.closed || s.canceled || isFull(s));
    });
    st.data = data;
    st.want = {};
    el('who').textContent = data.name + 'さん（' + data.memberId + '）';
    el('paused').hidden = !data.paused;
    el('deadline').textContent = '予約は' + data.deadline + '受け付けます。締切後に休む場合は道場へご連絡ください。';

    var seen = {};
    st.months = [];
    data.sessions.forEach(function (s) {
      var m = s.date.slice(0, 7);
      if (!seen[m]) { seen[m] = true; st.months.push(m); }
    });
    if (first) st.mi = initialMonth();
    st.mi = Math.min(st.mi, Math.max(st.months.length - 1, 0));
    render();
  }

  /** 予約できる稽古がいちばん多い月を最初に開きます（告知後は翌月になります）。 */
  function initialMonth() {
    var best = 0, bestN = -1;
    st.months.forEach(function (m, i) {
      var n = st.data.sessions.filter(function (s) { return s.date.indexOf(m) === 0 && !s.closed; }).length;
      if (n > bestN) { best = i; bestN = n; }
    });
    return best;
  }

  // ------------------------------------------------------------
  // 状態
  // ------------------------------------------------------------
  function isFull(s) { return s.cap > 0 && s.count >= s.cap && !s.reserved; }
  function locked(s) { return s.closed || s.canceled || isFull(s) || (st.data.paused && !s.reserved); }

  function wants(s) { return (s.id in st.want) ? st.want[s.id] : s.reserved; }

  /** booked / adding / removing / open / off */
  function stateOf(s) {
    var w = wants(s);
    if (s.reserved && !w) return 'removing';
    if (!s.reserved && w) return 'adding';
    if (s.reserved) return 'booked';
    return locked(s) ? 'off' : 'open';
  }

  function toggle(id) {
    var s = find(id);
    if (!s) return;
    if (s.canceled) { toast('この稽古は中止になりました'); return; }
    if (s.closed) { toast(s.reserved ? '締切を過ぎたため、ここでは取り消せません。道場へご連絡ください' : '受付を締め切りました'); return; }
    if (!s.reserved && st.data.paused) { toast('休会中のため予約できません'); return; }
    if (isFull(s)) { toast('満席です'); return; }

    var next = !wants(s);
    if (next === s.reserved) delete st.want[id]; else st.want[id] = next;
    render();
    if (el('layer').firstChild && el('layer').getAttribute('data-date')) openDay(el('layer').getAttribute('data-date'));
  }

  function changes() {
    var add = [], cxl = [];
    st.data.sessions.forEach(function (s) {
      if (!(s.id in st.want)) return;
      if (st.want[s.id] && !s.reserved) add.push(s);
      if (!st.want[s.id] && s.reserved) cxl.push(s);
    });
    return { add: add, cxl: cxl };
  }

  // ------------------------------------------------------------
  // 描画
  // ------------------------------------------------------------
  function render() {
    var m = st.months[st.mi];
    if (!m) {
      el('mon').innerHTML = '';
      el('grid').innerHTML = '';
      el('listView').innerHTML = '<div class="empty">予約できる稽古はまだありません。<br>次月の日程は月末ごろにLINEでお知らせします。</div>';
      el('calView').hidden = true;
      el('listView').hidden = false;
      renderFoot();
      return;
    }

    var p = m.split('-');
    var inMonth = st.data.sessions.filter(function (s) { return s.date.indexOf(m) === 0; });
    var booked = inMonth.filter(function (s) { return wants(s); }).length;
    el('mon').innerHTML = Number(p[1]) + '月<small>' + p[0] + '年・予約 ' + booked + ' / ' + inMonth.length + '回</small>';
    el('prev').disabled = st.mi === 0;
    el('next').disabled = st.mi >= st.months.length - 1;

    el('vCal').setAttribute('aria-pressed', st.view === 'cal');
    el('vList').setAttribute('aria-pressed', st.view === 'list');
    el('calView').hidden = st.view !== 'cal';
    el('listView').hidden = st.view !== 'list';

    renderCal(Number(p[0]), Number(p[1]), inMonth);
    renderList(inMonth);
    renderFoot();
  }

  function renderCal(y, mo, inMonth) {
    var byDate = {};
    inMonth.forEach(function (s) { (byDate[s.date] = byDate[s.date] || []).push(s); });

    var first = new Date(y, mo - 1, 1).getDay();
    var days = new Date(y, mo, 0).getDate();
    var html = '';
    for (var i = 0; i < first; i++) html += '<div class="cell blank"></div>';

    for (var d = 1; d <= days; d++) {
      var key = y + '-' + pad(mo) + '-' + pad(d);
      var wd = (first + d - 1) % 7;
      var list = byDate[key] || [];
      var cls = 'cell' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') +
        (key < st.data.today ? ' past' : '') + (key === st.data.today ? ' today' : '') +
        (list.length ? ' has' : '');

      var pills = list.slice(0, 2).map(function (s) {
        var k = stateOf(s);
        var mark = k === 'booked' ? '✔' : k === 'adding' ? '＋' : '';
        return '<span class="pill ' + k + '">' + mark + esc(s.start) + '</span>';
      }).join('');
      if (list.length > 2) pills += '<span class="pill more">他' + (list.length - 2) + '件</span>';

      var label = (mo + '月' + d + '日') + (list.length ? '、稽古' + list.length + '件' : '');
      html += list.length
        ? '<button class="' + cls + '" data-date="' + key + '" aria-label="' + label + '"><span class="d">' + d + '</span>' + pills + '</button>'
        : '<div class="' + cls + '"><span class="d">' + d + '</span></div>';
    }
    var rest = (7 - (first + days) % 7) % 7;
    for (var j = 0; j < rest; j++) html += '<div class="cell blank"></div>';

    el('grid').innerHTML = html;
    each('#grid .cell.has', function (c) {
      c.onclick = function () {
        var key = c.getAttribute('data-date');
        var list = byDate[key];
        if (list.length === 1) toggle(list[0].id); else openDay(key);
      };
    });
  }

  function renderList(inMonth) {
    el('listView').innerHTML = inMonth.length
      ? inMonth.map(rowHtml).join('')
      : '<div class="empty">この月の稽古はありません。</div>';
    bindRows(el('listView'));
  }

  function rowHtml(s) {
    var k = stateOf(s);
    var d = new Date(s.date.replace(/-/g, '/'));
    var wd = d.getDay();

    var tag = '';
    if (s.canceled) tag = '<span class="tag off">中止</span>';
    else if (k === 'adding') tag = '<span class="tag add">これから予約</span>';
    else if (k === 'removing') tag = '<span class="tag cxl">これから取消</span>';
    else if (k === 'booked') tag = '<span class="tag">予約済み</span>';

    var sub = [];
    if (s.place) sub.push(esc(s.place));
    if (s.cap > 0) sub.push('残り ' + Math.max(s.cap - s.count, 0) + ' / ' + s.cap + '人');
    else sub.push('予約 ' + s.count + '人');

    var chk = { booked: 'on', adding: 'add', removing: 'cxl', open: '', off: 'off' }[k];
    var mark = (k === 'booked' || k === 'adding') ? '✔' : k === 'removing' ? '✕' : '';

    return '<button class="row ' + k + '" data-id="' + esc(s.id) + '" aria-pressed="' + wants(s) + '">' +
      '<div class="date' + (wd === 0 ? ' sun' : wd === 6 ? ' sat' : '') + '"><b>' + (d.getMonth() + 1) + '/' + d.getDate() + '</b>' +
      '<span>' + WEEK[wd] + '曜</span></div>' +
      '<div class="info"><div class="t">' + esc(s.start) + (s.end ? '〜' + esc(s.end) : '') + '　' + esc(s.cls) + tag + '</div>' +
      '<div class="s">' + sub.join('・') + '</div></div>' +
      '<span class="chk ' + chk + '" aria-hidden="true">' + mark + '</span></button>';
  }

  function bindRows(root) {
    Array.prototype.forEach.call(root.querySelectorAll('.row'), function (r) {
      r.onclick = function () { toggle(r.getAttribute('data-id')); };
    });
  }

  function renderFoot() {
    var c = changes();
    var n = c.add.length + c.cxl.length;
    var mine = st.data ? st.data.sessions.filter(function (s) { return s.reserved; }).length : 0;
    el('sum').innerHTML = n
      ? '<b>' + [c.add.length ? '予約 ' + c.add.length + '件' : '', c.cxl.length ? '取消 ' + c.cxl.length + '件' : ''].filter(String).join('・') + '</b><br>まだ確定していません'
      : '日付をタップして選びます<br>現在のご予約 ' + mine + '件';
    el('apply').disabled = !n;
  }

  // ------------------------------------------------------------
  // シート
  // ------------------------------------------------------------
  function openDay(key) {
    var list = st.data.sessions.filter(function (s) { return s.date === key; });
    var d = new Date(key.replace(/-/g, '/'));
    sheet('<h3>' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WEEK[d.getDay()] + '）の稽古</h3>' +
      '<div class="list">' + list.map(rowHtml).join('') + '</div>' +
      '<div class="acts"><button class="btn ghost" data-close>閉じる</button></div>', key);
    bindRows(el('layer'));
  }

  function openConfirm() {
    var c = changes();
    var li = function (s) {
      return '<li>' + label(s) + (s.place ? '<small>' + esc(s.place) + '</small>' : '') + '</li>';
    };
    sheet('<h3>この内容で確定します</h3>' +
      (c.add.length ? '<div class="grp"><h4>予約する（' + c.add.length + '件）</h4><ul>' + c.add.map(li).join('') + '</ul></div>' : '') +
      (c.cxl.length ? '<div class="grp"><h4>キャンセルする（' + c.cxl.length + '件）</h4><ul>' + c.cxl.map(li).join('') + '</ul></div>' : '') +
      '<div class="acts"><button class="btn ghost" data-close>戻る</button>' +
      '<button class="btn primary" id="go">確定する</button></div>');
    el('go').onclick = submit;
  }

  function sheet(html, dateKey) {
    var layer = el('layer');
    layer.innerHTML = '<div class="ov"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
    layer.setAttribute('data-date', dateKey || '');
    layer.querySelector('.ov').onclick = function (e) { if (e.target === this) closeSheet(); };
    each('#layer [data-close]', function (b) { b.onclick = closeSheet; });
  }

  function closeSheet() {
    el('layer').innerHTML = '';
    el('layer').removeAttribute('data-date');
  }

  // ------------------------------------------------------------
  // 確定
  // ------------------------------------------------------------
  function submit() {
    var c = changes();
    var byId = {};
    st.data.sessions.forEach(function (s) { byId[s.id] = s; });

    closeSheet();
    el('layer').innerHTML = '<div class="busy"><div>保存しています…</div></div>';

    api('apiBookingApply', [auth, ids(c.add), ids(c.cxl)], function (res) {
      if (!res.ok) { closeSheet(); toast(res.message); return; }

      setData(res.data, false);
      var ok = res.results.filter(function (r) { return r.ok; });
      var ng = res.results.filter(function (r) { return !r.ok; });

      var li = function (r) {
        var s = byId[r.id];
        var head = (r.action === 'reserve' ? '予約：' : '取消：') + (s ? label(s) : r.id);
        return '<li' + (r.ok ? '' : ' class="ng"') + '>' + head + (r.ok ? '' : '<small>' + esc(r.message) + '</small>') + '</li>';
      };
      sheet('<h3>' + (ng.length ? '一部を確定できませんでした' : '確定しました') + '</h3>' +
        (ok.length ? '<div class="grp"><h4>確定した内容</h4><ul>' + ok.map(li).join('') + '</ul></div>' : '') +
        (ng.length ? '<div class="grp"><h4>確定できなかった内容</h4><ul>' + ng.map(li).join('') + '</ul></div>' : '') +
        '<div class="acts"><button class="btn primary" data-close>閉じる</button></div>');

      leaveNote(ok, byId);
    }, function () {
      closeSheet();
      toast('保存に失敗しました。電波状況をご確認のうえ、もう一度お試しください');
    });
  }

  /** 確定内容をトークに控えとして残します（LINEアプリ内で開いたときだけ・失敗しても無視）。 */
  function leaveNote(ok, byId) {
    if (!ok.length || window.BOOKING_MOCK || !window.liff || !liff.isInClient()) return;
    var lines = ok.map(function (r) {
      var s = byId[r.id];
      return (r.action === 'reserve' ? '予約　' : '取消　') + (s ? label(s) : r.id);
    });
    liff.sendMessages([{ type: 'text', text: '【予約画面】\n' + lines.join('\n') }]).catch(function () {});
  }

  // ------------------------------------------------------------
  // 小道具
  // ------------------------------------------------------------
  /**
   * Apps Script の操作を呼びます。
   * text/plain で送るのは、ブラウザの事前確認（CORS preflight）を避けるためです。
   */
  function api(name, args, ok, ng) {
    if (window.BOOKING_API) { window.BOOKING_API(name, args, ok, ng); return; }
    fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ api: name, args: args }),
    }).then(function (r) { return r.json(); }).then(ok).catch(ng);
  }
  function el(id) { return document.getElementById(id); }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
  function find(id) { return st.data.sessions.filter(function (s) { return s.id === id; })[0]; }
  function ids(list) { return list.map(function (s) { return s.id; }); }
  function pad(n) { return ('0' + n).slice(-2); }
  function label(s) {
    var d = new Date(s.date.replace(/-/g, '/'));
    return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ') ' + esc(s.start) + ' ' + esc(s.cls);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function gate(title, msg) {
    el('gate').innerHTML = '<b>' + esc(title) + '</b>' + esc(msg || '').replace(/\n/g, '<br>');
    el('gate').hidden = false;
    el('app').hidden = true;
    el('foot').hidden = true;
    el('who').textContent = '';
  }
  var toastTimer = null;
  function toast(msg) {
    var t = el('toast');
    t.textContent = msg;
    t.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, 2600);
  }

  el('prev').onclick = function () { if (st.mi > 0) { st.mi--; render(); } };
  el('next').onclick = function () { if (st.mi < st.months.length - 1) { st.mi++; render(); } };
  el('vCal').onclick = function () { st.view = 'cal'; render(); };
  el('vList').onclick = function () { st.view = 'list'; render(); };
  el('apply').onclick = openConfirm;

  boot();
</script>
<!--/SCRIPT-->
</body>
</html>
